apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager
spec:
  replicas: 1
  selector:
    matchLabels: { app: task-manager }
    template:
      metadata:
        labels: { app: task-manager }
      spec:
        containers:
          - name: app
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            ports: [{ containerPort: 8080 }]
            env:
              - name: DB_URL
                value: "postgres://postgres:postgres@postgresql.database:5432/app?sslmode=disable"
              - name: NATS_URL
                value: "nats://nats.nats:4222"
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "250m"
                memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: task-manager
spec:
  selector: { app: task-manager }
  ports: [{ port: 80, targetPort: 8080 }]
